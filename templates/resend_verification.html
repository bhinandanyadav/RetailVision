<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification — RetailVision</title>
    <meta name="description" content="Resend the email verification link for your RetailVision account.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Resend Verification — RetailVision">
    <meta property="og:description" content="Get a new email verification link for RetailVision.">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1220;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 45%), var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
        }
        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        input {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
        }
        input:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: 2px;
        }
        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        button:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: 2px;
        }
        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #fecaca;
        }
        .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #86efac;
        }
        .links {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .links a {
            color: var(--text-primary);
            text-decoration: none;
        }
        @media (max-width: 600px) {
            body { align-items: flex-start; padding: 16px; }
            .card { padding: 24px 20px; border-radius: 16px; }
            .card h1 { font-size: 1.35rem; }
            button { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Resend Verification Email</h1>
        <p class="subtitle">Enter your registered email and we'll resend the verification link.</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success" role="status">If that email is registered and unverified, a verification link has been sent.</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <button type="submit">Resend Link</button>
        </form>
        <p class="links">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </p>
    </main>
</body>
</html>
