<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1220;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 45%), var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }
        .icon.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }
        .icon.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }
        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon {{ 'success' if success else 'error' }}">
            {{ '✓' if success else '✗' }}
        </div>
        <h1>{{ 'Email Verified' if success else 'Verification Failed' }}</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('login') }}">Go to Login</a>
    </main>
</body>
</html>
