<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — RetailVision Analytics</title>
    <meta name="description" content="Enter your one-time verification code to access your RetailVision analytics dashboard.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Verify OTP — RetailVision Analytics">
    <meta property="og:description" content="Enter your verification code to access RetailVision.">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1220;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 45%), var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }
        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
            text-align: center;
            font-size: 0.9rem;
        }
        .subtitle strong {
            color: var(--text-primary);
        }
        .otp-input {
            width: 100%;
            padding: 16px;
            background: #0f172a;
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 12px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }
        .otp-input:focus {
            border-color: #2563eb;
        }
        .otp-input::placeholder {
            color: #475569;
            letter-spacing: 4px;
            font-size: 16px;
            font-weight: 400;
        }
        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            margin-top: 16px;
            transition: opacity 0.2s ease;
        }
        button:hover {
            opacity: 0.9;
        }
        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: 2px;
        }
        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #fecaca;
            font-size: 0.85rem;
        }
        .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #86efac;
            font-size: 0.85rem;
        }
        .resend-form {
            text-align: center;
            margin-top: 16px;
        }
        .resend-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            padding: 0;
            width: auto;
            margin-top: 8px;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .resend-btn:hover {
            color: var(--text-primary);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .back-link a {
            color: var(--text-primary);
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body { align-items: flex-start; padding: 16px; }
            .card { padding: 28px 20px; border-radius: 16px; }
            .card h1 { font-size: 1.35rem; }
            .otp-input { font-size: 24px; letter-spacing: 8px; }
            button { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">🔒</div>
        <h1>Enter Verification Code</h1>
        <p class="subtitle">We sent a 6-digit code to<br><strong>{{ email }}</strong></p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}
        {% if msg == 'otp_sent' %}
            <div class="success" role="status">New OTP sent to your email.</div>
        {% endif %}

        <form method="POST">
            <input class="otp-input" type="text" name="otp" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" autofocus required>
            <button type="submit">Verify &amp; Sign In</button>
        </form>

        <div class="resend-form">
            <form method="POST" action="{{ url_for('login_resend_otp') }}">
                <button type="submit" class="resend-btn">Resend OTP</button>
            </form>
        </div>

        <p class="back-link">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var otpInput = document.querySelector('.otp-input');
            if (otpInput) {
                otpInput.addEventListener('input', function(e) {
                    var val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val;
                    if (val.length === 6) {
                        e.target.form.submit();
                    }
                });
            }
        });
    </script>
</body>
</html>
