<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0b1220;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-border: rgba(148, 163, 184, 0.18);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5f5;
        }

        body {
            font-family: 'Work Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 45%), var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-card {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 28px 30px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
        }

        .register-card h1 {
            font-family: 'Space Grotesk', 'Work Sans', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .register-card p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        input {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #fecaca;
        }
    </style>
</head>
<body>
    <form class="register-card" method="POST">
        <h1>Create Account</h1>
        <p>Sign up to access the Store Tracker dashboard.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" required>
        </div>
        <button type="submit">Create Account</button>
        <p style="margin-top: 14px; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--text-primary); text-decoration: none;">Sign in</a>
        </p>
    </form>
</body>
</html>
