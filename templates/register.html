<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — RetailVision Analytics</title>
    <meta name="description" content="Create your RetailVision account — Get started with AI-powered retail analytics, customer tracking, and store heatmaps.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Create Account — RetailVision Analytics">
    <meta property="og:description" content="Sign up for RetailVision retail analytics dashboard.">
    <meta property="og:url" content="https://retailvision.app/register">
    <meta property="og:site_name" content="RetailVision">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5a4;
            --accent: #f97316;
            --bg: #081018;
            --panel: rgba(10, 21, 29, 0.95);
            --panel-border: rgba(148, 163, 184, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #b5c3d6;
            --muted: #7f93ab;
        }

        .skip-link {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #0f172a;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            transform: translateY(-200%);
            transition: transform 0.2s ease;
            z-index: 20;
        }

        .skip-link:focus {
            transform: translateY(0);
            outline: 2px solid #f8fafc;
            outline-offset: 2px;
        }

        .a11y-toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 30;
            cursor: move;
        }

        .a11y-toolbar.is-dragging {
            user-select: none;
        }

        .a11y-toggle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #111827;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .a11y-toggle-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.45);
        }

        .a11y-toggle-btn:focus-visible {
            outline: 2px solid #0f172a;
            outline-offset: 2px;
        }

        .a11y-panel {
            position: absolute;
            top: 56px;
            right: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 16px;
            background: linear-gradient(90deg, #f6d365 0%, #fda085 100%);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.35);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .a11y-toolbar.is-expanded .a11y-panel {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .a11y-toolbar.is-expanded .a11y-toggle-btn {
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.5);
        }

        .a11y-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #111827;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            min-width: 40px;
            text-align: center;
        }

        .a11y-btn.is-toggle[aria-pressed="true"] {
            background: rgba(17, 24, 39, 0.15);
            border-color: rgba(17, 24, 39, 0.4);
        }

        .a11y-btn:focus-visible {
            outline: 2px solid #0f172a;
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body {
            font-family: 'Work Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 10% 15%, rgba(14, 165, 164, 0.16), transparent 40%),
                radial-gradient(circle at 90% 15%, rgba(249, 115, 22, 0.12), transparent 35%),
                linear-gradient(180deg, rgba(10, 21, 29, 0.94), rgba(8, 16, 24, 1));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-card {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 28px 30px;
            box-shadow: 0 20px 40px rgba(2, 6, 23, 0.35);
        }

        .register-card h1 {
            font-family: 'Space Grotesk', 'Work Sans', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .register-card p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .role-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 18px;
        }

        .role-card {
            display: grid;
            gap: 6px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(8, 16, 24, 0.65);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .role-card input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-card:hover {
            transform: translateY(-1px);
            border-color: rgba(14, 165, 164, 0.6);
            box-shadow: 0 10px 22px rgba(14, 165, 164, 0.12);
        }

        .role-card.is-locked {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .role-card.is-locked:hover {
            transform: none;
            border-color: rgba(148, 163, 184, 0.22);
            box-shadow: none;
        }

        .role-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .role-desc {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .role-lock {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .role-card.is-selected {
            border-color: rgba(14, 165, 164, 0.7);
            box-shadow: inset 0 0 0 1px rgba(14, 165, 164, 0.35);
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        input {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid rgba(14, 165, 164, 0.8);
            outline-offset: 2px;
        }

        .info {
            background: rgba(14, 165, 164, 0.15);
            border: 1px solid rgba(14, 165, 164, 0.3);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            color: #fecaca;
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 16px;
            }

            .register-card {
                padding: 20px;
                border-radius: 16px;
            }

            .register-card h1 {
                font-size: 1.55rem;
            }

            .role-card {
                padding: 12px 14px;
            }

            button {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="a11y-toolbar" id="a11yToolbar" role="toolbar" aria-label="Accessibility">
        <button class="a11y-toggle-btn" id="a11yToggle" type="button" aria-label="Toggle accessibility toolbar" aria-expanded="false" title="Accessibility">♿</button>
        <div class="a11y-panel" id="a11yPanel">
            <button class="a11y-btn" id="fontDecrease" type="button" aria-label="Decrease text size">A-</button>
            <button class="a11y-btn" id="fontReset" type="button" aria-label="Reset text size">A</button>
            <button class="a11y-btn" id="fontIncrease" type="button" aria-label="Increase text size">A+</button>
            <button class="a11y-btn is-toggle" id="screenReaderToggle" type="button" aria-pressed="false">Screen Reader</button>
        </div>
    </div>
    <main id="main">
        <form class="register-card" method="POST" aria-labelledby="register-title" aria-describedby="register-help register-info{% if error %} register-error{% endif %}">
            <h1 id="register-title">Create Account</h1>
            <p id="register-help">Choose the account type and fill in your details.</p>
        {% if error %}
            <div class="error" id="register-error" role="alert" aria-live="assertive">{{ error }}</div>
        {% endif %}
            <div class="info" id="register-info">Admin access requires a $21/month subscription. Admins activate after payment.</div>
        <div class="role-grid">
            <label class="role-card {% if (selected_role or 'viewer') == 'viewer' %}is-selected{% endif %}">
                <input type="radio" name="role" value="viewer" {% if (selected_role or 'viewer') == 'viewer' %}checked{% endif %}>
                <span class="role-title">Viewer</span>
                <span class="role-desc">Access live tracking, analytics, and reports.</span>
            </label>
            <label class="role-card {% if (selected_role or 'viewer') == 'admin' %}is-selected{% endif %}">
                <input type="radio" name="role" value="admin" {% if (selected_role or 'viewer') == 'admin' %}checked{% endif %}>
                <span class="role-title">Admin</span>
                <span class="role-desc">Manage cameras, settings, and audit logs.</span>
                <span class="role-lock">Subscription required</span>
            </label>
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
        </div>
        <button type="submit">Create Account</button>
        <p style="margin-top: 14px; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--text-primary); text-decoration: none;">Sign in</a>
        </p>
        </form>
    </main>
    <script>
        const roleCards = document.querySelectorAll('.role-card');

        roleCards.forEach((card) => {
            const input = card.querySelector('input');
            if (!input) {
                return;
            }

            card.addEventListener('click', () => {
                if (input.disabled) {
                    return;
                }
                roleCards.forEach((item) => item.classList.remove('is-selected'));
                card.classList.add('is-selected');
            });
        });
    </script>
    <script>
        (function () {
            const root = document.documentElement;
            const scaleStep = 0.05;
            const scaleMin = 0.9;
            const scaleMax = 1.3;
            let fontScale = parseFloat(localStorage.getItem('a11yFontScale') || '1');
            let speakEnabled = localStorage.getItem('a11ySpeakEnabled') === 'true';

            const a11yToggle = document.getElementById('a11yToggle');
            const a11yPanel = document.getElementById('a11yPanel');
            const decBtn = document.getElementById('fontDecrease');
            const resetBtn = document.getElementById('fontReset');
            const incBtn = document.getElementById('fontIncrease');
            const toggleBtn = document.getElementById('screenReaderToggle');

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function applyFontScale() {
                fontScale = clamp(fontScale, scaleMin, scaleMax);
                root.style.fontSize = `${(fontScale * 100).toFixed(0)}%`;
                localStorage.setItem('a11yFontScale', fontScale.toFixed(2));
            }

            function setSpeakEnabled(enabled) {
                speakEnabled = enabled;
                localStorage.setItem('a11ySpeakEnabled', enabled ? 'true' : 'false');
                if (toggleBtn) {
                    toggleBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
                }
            }

            function speak(text) {
                if (!speakEnabled || !text || !window.speechSynthesis) {
                    return;
                }
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = 1;
                window.speechSynthesis.speak(utter);
            }

            function getReadableLabel(el) {
                if (!el) {
                    return '';
                }
                const aria = el.getAttribute('aria-label');
                if (aria) {
                    return aria.trim();
                }
                if (el.id) {
                    const label = document.querySelector(`label[for="${el.id}"]`);
                    if (label) {
                        return label.textContent.trim();
                    }
                }
                const placeholder = el.getAttribute('placeholder');
                if (placeholder) {
                    return placeholder.trim();
                }
                return (el.textContent || '').trim();
            }

            applyFontScale();
            setSpeakEnabled(speakEnabled);

            if (a11yToggle) {
                a11yToggle.addEventListener('click', () => {
                    const toolbar = document.getElementById('a11yToolbar');
                    const isExpanded = toolbar.classList.toggle('is-expanded');
                    a11yToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
                });
            }

            if (a11yPanel) {
                a11yPanel.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }

            document.addEventListener('click', (e) => {
                const toolbar = document.getElementById('a11yToolbar');
                if (toolbar && toolbar.classList.contains('is-expanded') && !toolbar.contains(e.target)) {
                    toolbar.classList.remove('is-expanded');
                    if (a11yToggle) a11yToggle.setAttribute('aria-expanded', 'false');
                }
            });

            if (decBtn) {
                decBtn.addEventListener('click', () => {
                    fontScale -= scaleStep;
                    applyFontScale();
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    fontScale = 1;
                    applyFontScale();
                });
            }

            if (incBtn) {
                incBtn.addEventListener('click', () => {
                    fontScale += scaleStep;
                    applyFontScale();
                });
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    setSpeakEnabled(!speakEnabled);
                });
            }

            document.addEventListener('focusin', (event) => {
                const target = event.target;
                if (!speakEnabled || !target || target === document.body) {
                    return;
                }
                const tag = (target.tagName || '').toLowerCase();
                const role = target.getAttribute('role');
                const isInteractive = ['input', 'select', 'textarea', 'button', 'a'].includes(tag) || role === 'button';
                if (isInteractive) {
                    const label = getReadableLabel(target);
                    if (label) {
                        speak(label);
                    }
                }
            });

            function applyToolbarPosition() {
                const saved = localStorage.getItem('a11yToolbarPos');
                if (!saved) {
                    return;
                }
                try {
                    const pos = JSON.parse(saved);
                    if (typeof pos?.top === 'number' && typeof pos?.left === 'number') {
                        const toolbar = document.getElementById('a11yToolbar');
                        if (toolbar) {
                            toolbar.style.left = `${pos.left}px`;
                            toolbar.style.top = `${pos.top}px`;
                            toolbar.style.right = 'auto';
                        }
                    }
                } catch (error) {
                    return;
                }
            }

            function enableToolbarDrag() {
                const toolbar = document.getElementById('a11yToolbar');
                if (!toolbar) {
                    return;
                }
                let startX = 0;
                let startY = 0;
                let originLeft = 0;
                let originTop = 0;
                let dragging = false;

                function onPointerMove(event) {
                    if (!dragging) {
                        return;
                    }
                    const nextLeft = originLeft + (event.clientX - startX);
                    const nextTop = originTop + (event.clientY - startY);
                    const maxLeft = window.innerWidth - toolbar.offsetWidth - 8;
                    const maxTop = window.innerHeight - toolbar.offsetHeight - 8;
                    const clampedLeft = Math.min(Math.max(8, nextLeft), Math.max(8, maxLeft));
                    const clampedTop = Math.min(Math.max(8, nextTop), Math.max(8, maxTop));
                    toolbar.style.left = `${clampedLeft}px`;
                    toolbar.style.top = `${clampedTop}px`;
                    toolbar.style.right = 'auto';
                }

                function stopDragging() {
                    if (!dragging) {
                        return;
                    }
                    dragging = false;
                    toolbar.classList.remove('is-dragging');
                    toolbar.releasePointerCapture?.(toolbar._pointerId || 0);
                    const left = parseFloat(toolbar.style.left || '0');
                    const top = parseFloat(toolbar.style.top || '0');
                    if (!Number.isNaN(left) && !Number.isNaN(top)) {
                        localStorage.setItem('a11yToolbarPos', JSON.stringify({ left, top }));
                    }
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', stopDragging);
                }

                toolbar.addEventListener('pointerdown', (event) => {
                    if (event.button !== 0 || !event.target.closest('.a11y-toggle-btn')) {
                        return;
                    }
                    const dx = event.clientX;
                    const dy = event.clientY;
                    let moved = false;
                    const rect = toolbar.getBoundingClientRect();
                    startX = dx;
                    startY = dy;
                    originLeft = rect.left;
                    originTop = rect.top;

                    function onMove(e) {
                        if (Math.abs(e.clientX - dx) > 4 || Math.abs(e.clientY - dy) > 4) {
                            if (!moved) {
                                moved = true;
                                dragging = true;
                                toolbar.classList.add('is-dragging');
                                toolbar._pointerId = event.pointerId;
                                toolbar.setPointerCapture?.(event.pointerId);
                                document.addEventListener('pointermove', onPointerMove);
                                document.addEventListener('pointerup', stopDragging);
                            }
                        }
                    }

                    function onUp() {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                    }

                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                });
            }

            applyToolbarPosition();
            enableToolbarDrag();
        })();
    </script>
</body>
</html>
