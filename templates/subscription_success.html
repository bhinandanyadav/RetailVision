<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Active — RetailVision</title>
    <meta name="description" content="Your RetailVision subscription is now active. Access all premium features.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Subscription Active — RetailVision">
    <meta property="og:description" content="Your RetailVision subscription is active.">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5a4; --bg:#081018; --panel:rgba(10,21,29,0.95); --text-primary:#f8fafc; --text-secondary:#b5c3d6 }
        .skip-link { position: absolute; top: 12px; left: 12px; background: #0f172a; color: #ffffff; padding: 8px 12px; border-radius: 8px; text-decoration: none; transform: translateY(-200%); transition: transform 0.2s ease; z-index: 20; }
        .skip-link:focus { transform: translateY(0); outline: 2px solid #f8fafc; outline-offset: 2px; }
        a:focus-visible { outline: 2px solid rgba(14, 165, 164, 0.8); outline-offset: 2px; }
        .a11y-toolbar { position: fixed; top: 16px; right: 16px; z-index: 30; cursor: move; }
        .a11y-toolbar.is-dragging { user-select: none; }
        .a11y-toggle-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); border: none; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #111827; transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative; z-index: 2; }
        .a11y-toggle-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(15, 23, 42, 0.45); }
        .a11y-toggle-btn:focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
        .a11y-panel { position: absolute; top: 56px; right: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 16px; background: linear-gradient(90deg, #f6d365 0%, #fda085 100%); box-shadow: 0 10px 24px rgba(15, 23, 42, 0.35); opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.95); transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease; }
        .a11y-toolbar.is-expanded .a11y-panel { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        .a11y-toolbar.is-expanded .a11y-toggle-btn { box-shadow: 0 4px 20px rgba(15, 23, 42, 0.5); }
        .a11y-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.6); color: #111827; font-weight: 700; padding: 6px 10px; border-radius: 10px; cursor: pointer; min-width: 40px; text-align: center; }
        .a11y-btn.is-toggle[aria-pressed="true"] { background: rgba(17, 24, 39, 0.15); border-color: rgba(17, 24, 39, 0.4); }
        .a11y-btn:focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
        body{font-family: 'Work Sans', sans-serif; background:var(--bg); color:var(--text-primary); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px}
        .card{background:var(--panel); border-radius:14px; padding:28px; border:1px solid rgba(148,163,184,0.12); width:min(640px,100%)}
        h1{font-family:'Space Grotesk', sans-serif}
        p{color:var(--text-secondary)}
        a.button{display:inline-block;margin-top:12px;background:var(--primary); color:white; padding:10px 14px;border-radius:10px; text-decoration:none}

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 16px;
            }

            .card {
                padding: 20px;
                border-radius: 16px;
            }

            a.button {
                display: block;
                text-align: center;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="a11y-toolbar" id="a11yToolbar" role="toolbar" aria-label="Accessibility">
        <button class="a11y-toggle-btn" id="a11yToggle" type="button" aria-label="Toggle accessibility toolbar" aria-expanded="false" title="Accessibility">♿</button>
        <div class="a11y-panel" id="a11yPanel">
            <button class="a11y-btn" id="fontDecrease" type="button" aria-label="Decrease text size">A-</button>
            <button class="a11y-btn" id="fontReset" type="button" aria-label="Reset text size">A</button>
            <button class="a11y-btn" id="fontIncrease" type="button" aria-label="Increase text size">A+</button>
            <button class="a11y-btn is-toggle" id="screenReaderToggle" type="button" aria-pressed="false">Screen Reader</button>
        </div>
    </div>
    <main id="main">
        <div class="card" aria-labelledby="success-title" aria-describedby="success-help">
            <h1 id="success-title">Payment Successful</h1>
            <p id="success-help">Your admin subscription is now active. You can access admin features in the dashboard.</p>
            <a class="button" href="{{ url_for('home') }}">Go to Dashboard</a>
        </div>
    </main>
    <script>
        (function () {
            const root = document.documentElement;
            const scaleStep = 0.05;
            const scaleMin = 0.9;
            const scaleMax = 1.3;
            let fontScale = parseFloat(localStorage.getItem('a11yFontScale') || '1');
            let speakEnabled = localStorage.getItem('a11ySpeakEnabled') === 'true';

            const a11yToggle = document.getElementById('a11yToggle');
            const a11yPanel = document.getElementById('a11yPanel');
            const decBtn = document.getElementById('fontDecrease');
            const resetBtn = document.getElementById('fontReset');
            const incBtn = document.getElementById('fontIncrease');
            const toggleBtn = document.getElementById('screenReaderToggle');

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function applyFontScale() {
                fontScale = clamp(fontScale, scaleMin, scaleMax);
                root.style.fontSize = `${(fontScale * 100).toFixed(0)}%`;
                localStorage.setItem('a11yFontScale', fontScale.toFixed(2));
            }

            function setSpeakEnabled(enabled) {
                speakEnabled = enabled;
                localStorage.setItem('a11ySpeakEnabled', enabled ? 'true' : 'false');
                if (toggleBtn) {
                    toggleBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
                }
            }

            function speak(text) {
                if (!speakEnabled || !text || !window.speechSynthesis) {
                    return;
                }
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = 1;
                window.speechSynthesis.speak(utter);
            }

            function getReadableLabel(el) {
                if (!el) {
                    return '';
                }
                const aria = el.getAttribute('aria-label');
                if (aria) {
                    return aria.trim();
                }
                if (el.id) {
                    const label = document.querySelector(`label[for="${el.id}"]`);
                    if (label) {
                        return label.textContent.trim();
                    }
                }
                const placeholder = el.getAttribute('placeholder');
                if (placeholder) {
                    return placeholder.trim();
                }
                return (el.textContent || '').trim();
            }

            applyFontScale();
            setSpeakEnabled(speakEnabled);

            if (a11yToggle) {
                a11yToggle.addEventListener('click', () => {
                    const toolbar = document.getElementById('a11yToolbar');
                    const isExpanded = toolbar.classList.toggle('is-expanded');
                    a11yToggle.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
                });
            }

            if (a11yPanel) {
                a11yPanel.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }

            document.addEventListener('click', (e) => {
                const toolbar = document.getElementById('a11yToolbar');
                if (toolbar && toolbar.classList.contains('is-expanded') && !toolbar.contains(e.target)) {
                    toolbar.classList.remove('is-expanded');
                    if (a11yToggle) a11yToggle.setAttribute('aria-expanded', 'false');
                }
            });

            if (decBtn) {
                decBtn.addEventListener('click', () => {
                    fontScale -= scaleStep;
                    applyFontScale();
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    fontScale = 1;
                    applyFontScale();
                });
            }

            if (incBtn) {
                incBtn.addEventListener('click', () => {
                    fontScale += scaleStep;
                    applyFontScale();
                });
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    setSpeakEnabled(!speakEnabled);
                });
            }

            document.addEventListener('focusin', (event) => {
                const target = event.target;
                if (!speakEnabled || !target || target === document.body) {
                    return;
                }
                const tag = (target.tagName || '').toLowerCase();
                const role = target.getAttribute('role');
                const isInteractive = ['input', 'select', 'textarea', 'button', 'a'].includes(tag) || role === 'button';
                if (isInteractive) {
                    const label = getReadableLabel(target);
                    if (label) {
                        speak(label);
                    }
                }
            });

            function applyToolbarPosition() {
                const saved = localStorage.getItem('a11yToolbarPos');
                if (!saved) {
                    return;
                }
                try {
                    const pos = JSON.parse(saved);
                    if (typeof pos?.top === 'number' && typeof pos?.left === 'number') {
                        const toolbar = document.getElementById('a11yToolbar');
                        if (toolbar) {
                            toolbar.style.left = `${pos.left}px`;
                            toolbar.style.top = `${pos.top}px`;
                            toolbar.style.right = 'auto';
                        }
                    }
                } catch (error) {
                    return;
                }
            }

            function enableToolbarDrag() {
                const toolbar = document.getElementById('a11yToolbar');
                if (!toolbar) {
                    return;
                }
                let startX = 0;
                let startY = 0;
                let originLeft = 0;
                let originTop = 0;
                let dragging = false;

                function onPointerMove(event) {
                    if (!dragging) {
                        return;
                    }
                    const nextLeft = originLeft + (event.clientX - startX);
                    const nextTop = originTop + (event.clientY - startY);
                    const maxLeft = window.innerWidth - toolbar.offsetWidth - 8;
                    const maxTop = window.innerHeight - toolbar.offsetHeight - 8;
                    const clampedLeft = Math.min(Math.max(8, nextLeft), Math.max(8, maxLeft));
                    const clampedTop = Math.min(Math.max(8, nextTop), Math.max(8, maxTop));
                    toolbar.style.left = `${clampedLeft}px`;
                    toolbar.style.top = `${clampedTop}px`;
                    toolbar.style.right = 'auto';
                }

                function stopDragging() {
                    if (!dragging) {
                        return;
                    }
                    dragging = false;
                    toolbar.classList.remove('is-dragging');
                    toolbar.releasePointerCapture?.(toolbar._pointerId || 0);
                    const left = parseFloat(toolbar.style.left || '0');
                    const top = parseFloat(toolbar.style.top || '0');
                    if (!Number.isNaN(left) && !Number.isNaN(top)) {
                        localStorage.setItem('a11yToolbarPos', JSON.stringify({ left, top }));
                    }
                    document.removeEventListener('pointermove', onPointerMove);
                    document.removeEventListener('pointerup', stopDragging);
                }

                toolbar.addEventListener('pointerdown', (event) => {
                    if (event.button !== 0 || !event.target.closest('.a11y-toggle-btn')) {
                        return;
                    }
                    const dx = event.clientX;
                    const dy = event.clientY;
                    let moved = false;
                    const rect = toolbar.getBoundingClientRect();
                    startX = dx;
                    startY = dy;
                    originLeft = rect.left;
                    originTop = rect.top;

                    function onMove(e) {
                        if (Math.abs(e.clientX - dx) > 4 || Math.abs(e.clientY - dy) > 4) {
                            if (!moved) {
                                moved = true;
                                dragging = true;
                                toolbar.classList.add('is-dragging');
                                toolbar._pointerId = event.pointerId;
                                toolbar.setPointerCapture?.(event.pointerId);
                                document.addEventListener('pointermove', onPointerMove);
                                document.addEventListener('pointerup', stopDragging);
                            }
                        }
                    }

                    function onUp() {
                        document.removeEventListener('pointermove', onMove);
                        document.removeEventListener('pointerup', onUp);
                    }

                    document.addEventListener('pointermove', onMove);
                    document.addEventListener('pointerup', onUp);
                });
            }

            applyToolbarPosition();
            enableToolbarDrag();
        })();
    </script>
</body>
</html>
